[project]
name = "little-list"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend install && npm --prefix frontend run build"
